version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-schooldb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: SchoolDB
      MYSQL_USER: school_user
      MYSQL_PASSWORD: school_password
    ports:
      - "3310:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d

volumes:
  mysql-data:
