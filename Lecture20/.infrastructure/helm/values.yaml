replicaCount: 2

image:
  repository: redis
  pullPolicy: IfNotPresent
  tag: "7.0"

service:
  type: ClusterIP
  port: 6379

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi

ingress:
  enabled: false
  tls: []
  hosts: []