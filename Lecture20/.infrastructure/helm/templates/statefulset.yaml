apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "redis-falco.fullname" . }}
  labels:
    {{- include "redis-falco.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "redis-falco.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "redis-falco.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redis-falco.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: {{ .Values.service.port }}
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [{{ .Values.persistence.accessMode | quote }}]
        resources:
          requests:
            storage: {{ .Values.persistence.size }}