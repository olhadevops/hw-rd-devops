apiVersion: v1
kind: Pod
metadata:
  name: '{{ include "redis-falco.fullname" . }}-test-connection'
  labels:
    {{- include "redis-falco.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: redis-cli
      image: redis:alpine
      command: ["redis-cli"]
      args: ["-h", '{{ include "redis-falco.fullname" . }}', "ping"]
  restartPolicy: Never